[project]
name = "webuntis-mcp"
version = "0.1.0"
description = "MCP server for the WebUntis school platform. Timetables, homework, exams, and absences for parents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "toughIQ" },
]
keywords = ["webuntis", "mcp", "school", "timetable", "parents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "mcp>=2.0",
    "pyotp",
    "requests",
]

[project.scripts]
webuntis-mcp = "webuntis_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
